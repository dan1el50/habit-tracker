spring:
  application:
    name: habit-tracker

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/habit_tracker}
    username: ${SPRING_DATASOURCE_USERNAME:habit_user}
    password: ${SPRING_DATASOURCE_PASSWORD:habit_pass}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080